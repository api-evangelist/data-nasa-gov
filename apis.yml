aid: data-nasa-gov
name: NASA Open Data
description: >-
  NASA Open Data is a federal government open-data portal for United States running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 36,454 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
