apis:
  - aid: data-nasa-gov:catalog
    name: NASA Open Data CKAN Action API
    description: >-
      CKAN Action API for NASA Open Data, a consistent JSON-over-HTTP interface over a catalog of 36,454 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://data.nasa.gov/api/3/action/.
